  <defs><clipPath id="aro-clip"><path d="M70 120 C100 92 260 84 340 98 C360 102 364 116 348 124 C260 140 110 144 70 120 Z"/></clipPath><pattern id="aro-scales" width="22" height="16" patternUnits="userSpaceOnUse"><path d="M0 16 A11 11 0 0 1 22 16" fill="none" stroke="#9C7A2C" stroke-width="2"/></pattern></defs>
