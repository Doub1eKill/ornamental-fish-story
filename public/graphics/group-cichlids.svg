<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="400" height="240" role="img" aria-labelledby="group-cichlids-title group-cichlids-desc">
  <title id="group-cichlids-title">กลุ่มปลาหมอสี (Cichlids)</title>
