    <path id="group-loaches-fin-dorsal" d="M196 102 C204 84 226 84 234 102 Z" fill="#B89A6A"/>
    <path id="group-loaches-fin-pelvic" d="M210 144 C214 160 230 162 234 144 Z" fill="#B89A6A"/>
    <path id="group-loaches-body" d="M100 128 C130 100 260 92 316 112 C334 118 336 134 318 138 C250 148 140 148 100 128 Z" fill="#D6B98A"/>
    <g id="group-loaches-pattern" clip-path="url(#loa-clip)" fill="#5A4632">
      <rect x="128" y="80" width="12" height="80"/><rect x="166" y="80" width="12" height="80"/>
      <rect x="204" y="80" width="12" height="80"/><rect x="242" y="80" width="12" height="80"/><rect x="280" y="80" width="10" height="80"/>
