<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="400" height="240" role="img" aria-labelledby="group-loaches-title group-loaches-desc">
  <title id="group-loaches-title">กลุ่มปลาหมู (Loaches)</title>
  <desc id="group-loaches-desc">ภาพประกอบปลาหมูข้างลาย ตัวแทนกลุ่มปลาหมู ลำตัวยาวสีน้ำตาลอ่อนมีแถบเข้ม ปากอยู่ต่ำ มีหนวดรอบปาก</desc>
